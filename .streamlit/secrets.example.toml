# Copy these values into your deployment secrets manager, not a tracked secrets.toml.
API_BASE_URL = "https://YOUR-FASTAPI-CONTAINER-APP"
FRONTEND_API_KEY = "GENERATE_A_LONG_RANDOM_SHARED_SECRET"

[auth]
redirect_uri = "https://YOUR-STREAMLIT-CONTAINER-APP/oauth2callback"
cookie_secret = "GENERATE_A_DIFFERENT_LONG_RANDOM_SECRET"
client_id = "YOUR_ENTRA_APP_REGISTRATION_CLIENT_ID"
client_secret = "YOUR_ENTRA_APP_REGISTRATION_SECRET"
server_metadata_url = "https://login.microsoftonline.com/YOUR_TENANT_ID/v2.0/.well-known/openid-configuration"
